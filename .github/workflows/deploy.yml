name: deploy

# Every push to main publishes:
#   - the web app on GitHub Pages: https://<user>.github.io/<repo>/
#   - an installable Android APK on the repo's Releases page
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create releases
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.10

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-binstall
      - run: cargo binstall -y --force "dioxus-cli@$DX_VERSION"
      - name: build
        run: dx bundle -p merlo --web --release --base-path "${{ github.event.repository.name }}" --out-dir dist
      - name: locate site root
        id: site
        run: echo "dir=$(dirname "$(find dist -name index.html | head -n1)")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.dir }}

  pages:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-binstall
      - run: cargo binstall -y --force "dioxus-cli@$DX_VERSION"
      - name: unlock (or create, on first run) the signing key
        # The release key lives encrypted in the repo; the ANDROID_KEY_PASSWORD secret unlocks it.
        # Same key every build, so new APKs install over old ones and keep your progress.
        # On the first run the key doesn't exist yet: create it, encrypt it, and commit it.
        env:
          PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY: .github/android/merlo.jks.enc
        if: env.HAS_KEY == 'true'
        run: |
          # The keystore password is derived from the secret as hex, because Dioxus.toml,
          # dx's template and the Kotlin build script each mangle characters like $ = & ".
          KEYPASS="$(printf '%s' "$PASSWORD" | sha256sum | cut -c1-40)"
          echo "::add-mask::$KEYPASS"
          if [ -f "$KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$KEY" -out merlo.jks -pass env:PASSWORD
          else
            keytool -genkeypair -keystore merlo.jks -storetype PKCS12 -alias merlo -keyalg RSA -keysize 4096 \
              -validity 10000 -storepass "$KEYPASS" -keypass "$KEYPASS" -dname "CN=Luca Rossi, O=Merlo"
            mkdir -p "$(dirname "$KEY")"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in merlo.jks -out "$KEY" -pass env:PASSWORD
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$KEY"
            git commit -m "ci(android): add encrypted release signing key"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          keytool -list -keystore merlo.jks -storepass "$KEYPASS" -alias merlo > /dev/null
          cat >> crates/app/Dioxus.toml <<EOF

          [bundle.android]
          jks_file = "merlo.jks"
          jks_password = "$KEYPASS"
          key_alias = "merlo"
          key_password = "$KEYPASS"
          EOF
      - name: build APK
        # The runner ships the Android SDK; point dx at its newest NDK.
        # Without the key (e.g. on a fork), dx falls back to a debug-signed APK.
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          rm -rf target/dx/merlo/release/android
          dx bundle -p merlo --android --release --target aarch64-linux-android --package-types apk --out-dir dist
          # dx 0.7 always ships its default icon and theme: lay ours over its generated
          # Gradle project (crates/app/android/res) and package again.
          GRADLE=target/dx/merlo/release/android/app
          cp -r crates/app/android/res/. "$GRADLE/app/src/main/res/"
          (cd "$GRADLE" && ./gradlew --quiet "$([ -f "$GITHUB_WORKSPACE/merlo.jks" ] && echo assembleRelease || echo assembleDebug)")
          APK="$(find "$GRADLE" -name '*release*.apk' | head -n1)"
          cp "${APK:-$(find "$GRADLE" -name '*.apk' | head -n1)}" merlo.apk
          rm -f merlo.jks
      - uses: actions/upload-artifact@v4
        with:
          name: merlo-android
          path: merlo.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Merlo build ${{ github.run_number }}
          prerelease: true
          files: merlo.apk
          body: |
            Android: download `merlo.apk` below on your phone and open it (allow installs from your browser when asked). Updates install over the previous version and keep your progress.
            Web: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
