    <ellipse cx="55" cy="35" rx="16" ry="12" transform="rotate(-20 55 35)"/>
    <path d="M40 39 L45 39 L45 86 L40 86 Z"/>
    <path d="M42 87 C61 86 77 70 81 41 C73 56 60 66 43 71 Z"/>
  </g>
  <path d="M44 27 L28 33.5 L44.5 37 Z" fill="#f5a623"/>
  <circle cx="51" cy="31" r="4.2" fill="#f5b82e"/>
  <circle cx="50.4" cy="31" r="2.1" fill="#18181c"/>
  <circle cx="49.6" cy="30.1" r="0.7" fill="#fff"/>
</svg>
