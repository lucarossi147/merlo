<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Merlo: an eighth note that is also a blackbird. The notehead is the head (beak to the left),
       the stem rises on its right, and the flag is a plain feather sweeping down. -->
  <!-- feather: from the top of the stem, an S-curve sweeping down to a fine tip -->
  <path fill="#18181c" d="M58.5 20 L64.5 20 C65.5 29 70 35 75.5 41.5 C82 49 85 58 82.5 68 C81.5 72 79.5 75.5 77 78.5 C79 72.5 79.5 66.5 77.5 61 C75.5 55.5 71 51.5 64.5 49.5 L58.5 49.5 Z"/>
  <!-- stem (body), slightly wider where it meets the head -->
  <path fill="#18181c" d="M58.5 20 L64.5 20 L65.2 64 C65.2 70 63 76 56 79 Z"/>
  <!-- head (notehead) -->
  <ellipse cx="46.5" cy="74" rx="17" ry="13.5" transform="rotate(-18 46.5 74)" fill="#18181c"/>
  <!-- gloss -->
  <path d="M38 66.5 C42 62.5 49 61 54.5 62.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.6" stroke-linecap="round"/>
  <!-- beak, two-tone -->
  <path d="M33.5 70.5 L16.5 76.5 L33.5 76.5 Z" fill="#f7b23b"/>
  <path d="M33.5 76.5 L16.5 76.5 L34.5 81 Z" fill="#d9860c"/>
  <!-- eye -->
  <circle cx="40.5" cy="71.5" r="5" fill="#f5b82e"/>
  <circle cx="39.8" cy="71.7" r="2.7" fill="#18181c"/>
  <circle cx="38.8" cy="70.6" r="0.95" fill="#ffffff"/>
</svg>
