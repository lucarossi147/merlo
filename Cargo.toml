[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Luca Rossi <lrossi@elements-ic.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# No `strip`: dx would strip the web binary before wasm-bindgen runs, and since
# LLVM 23 that deletes the custom section wasm-bindgen needs. wasm-opt already
# shrinks the web build.
